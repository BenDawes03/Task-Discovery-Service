apiVersion: v1
kind: ConfigMap
metadata:
  name: tds-firewall-rules
  namespace: tds-simulation
data:
  rules.txt: |
    # TDS Firewall Rules
    # Generated by k8s/generate-firewall-rules.ps1
    #
    # Format: <source-ip-or-cidr> <dest-ip-or-cidr>
    # Each line is an ALLOW rule; missing rule = blocked (when firewall is enabled).
    #
    # Policy:
    #   station-1 (via station-1-proxy) is BLOCKED from ticketdistributor-1.
    #   All other component pairs are ALLOWED.
    #
    # This file is initially empty (empty rules = permissive).
    # Run .\k8s\generate-firewall-rules.ps1 after full deployment to enforce blocking.
