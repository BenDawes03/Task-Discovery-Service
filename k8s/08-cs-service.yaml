apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs
  namespace: tds-simulation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cs
  template:
    metadata:
      labels:
        app: cs
    spec:
      containers:
      - name: cs
        image: sim-cs:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9101
        env:
        - name: CS_DB_DSN
          value: "postgres://postgres:pass@cs-db:5432/cs?sslmode=disable"
        - name: TDS_SERVER_ADDR
          valueFrom:
            configMapKeyRef:
              name: tds-config
              key: TDS_SERVER_ADDR
      initContainers:
      - name: wait-for-client-proxy
        image: busybox:1.28
        command: ['sh', '-c', 'until nslookup client-proxy; do echo waiting for client-proxy; sleep 1; done']
      - name: wait-for-cs-db
        image: busybox:1.28
        command: ['sh', '-c', 'until nslookup cs-db; do echo waiting for cs-db; sleep 1; done']
---
apiVersion: v1
kind: Service
metadata:
  name: cs
  namespace: tds-simulation
spec:
  selector:
    app: cs
  ports:
  - port: 9101
    targetPort: 9101
  type: NodePort
