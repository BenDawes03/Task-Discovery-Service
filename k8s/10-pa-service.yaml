apiVersion: v1
kind: ConfigMap
metadata:
  name: pa-keys
  namespace: tds-simulation
data:
  pa-private-key: |
    # Placeholder for PA private key
    # Replace with actual content from Simulation/keys/pctr_private.pem
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pa
  namespace: tds-simulation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pa
  template:
    metadata:
      labels:
        app: pa
    spec:
      containers:
      - name: pa
        image: sim-pa:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9103
        env:
        - name: PA_DB_DSN
          value: "postgres://postgres:pass@pa-db:5432/pa?sslmode=disable"
        - name: PA_PRIVATE_KEY
          value: "/run/keys/pctr_private.pem"
        - name: TDS_SERVER_ADDR
          valueFrom:
            configMapKeyRef:
              name: tds-config
              key: TDS_SERVER_ADDR
        volumeMounts:
        - name: pa-keys
          mountPath: /run/keys
          readOnly: true
      volumes:
      - name: pa-keys
        configMap:
          name: pa-keys
      initContainers:
      - name: wait-for-client-proxy
        image: busybox:1.28
        command: ['sh', '-c', 'until nslookup client-proxy; do echo waiting for client-proxy; sleep 1; done']
      - name: wait-for-pa-db
        image: busybox:1.28
        command: ['sh', '-c', 'until nslookup pa-db; do echo waiting for pa-db; sleep 1; done']
---
apiVersion: v1
kind: Service
metadata:
  name: pa
  namespace: tds-simulation
spec:
  selector:
    app: pa
  ports:
  - port: 9103
    targetPort: 9103
  type: NodePort
