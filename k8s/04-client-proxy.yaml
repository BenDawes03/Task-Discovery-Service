# Per-component client proxies
# Each simulation component gets its own dedicated proxy pod so the TDS server
# can identify the source of each query by pod IP, enabling per-component
# firewall rule enforcement.

# ---- cs-proxy ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs-proxy
  namespace: tds-simulation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cs-proxy
  template:
    metadata:
      labels:
        app: cs-proxy
    spec:
      containers:
      - name: client-proxy
        image: tds-client-proxy:latest
        imagePullPolicy: IfNotPresent
        args:
        - "-background"
        - "-tcp"
        ports:
        - containerPort: 5100
          name: proxy
          protocol: TCP
        env:
        - name: TDS_SERVER_ADDR
          valueFrom:
            configMapKeyRef:
              name: tds-config
              key: TDS_SERVER_ADDR
        - name: TDS_PROXY_LISTEN
          valueFrom:
            configMapKeyRef:
              name: tds-config
              key: TDS_PROXY_LISTEN
        - name: TDS_SERVER_PROTO
          value: "tls"
        - name: TDS_TLS_CERT_FILE
          value: "/run/tds-tls/client.crt"
        - name: TDS_TLS_KEY_FILE
          value: "/run/tds-tls/client.key"
        - name: TDS_TLS_CA_FILE
          value: "/run/tds-tls/ca.crt"
        volumeMounts:
        - name: tds-tls
          mountPath: /run/tds-tls
          readOnly: true
      volumes:
      - name: tds-tls
        secret:
          secretName: tds-tls-certs
      initContainers:
      - name: wait-for-tds-server
        image: busybox:1.28
        command: ['sh', '-c', 'until nslookup tds-server; do echo waiting for tds-server; sleep 1; done']
---
apiVersion: v1
kind: Service
metadata:
  name: cs-proxy
  namespace: tds-simulation
spec:
  selector:
    app: cs-proxy
  ports:
  - port: 5100
    targetPort: 5100
    name: proxy
    protocol: TCP
  type: ClusterIP
---
