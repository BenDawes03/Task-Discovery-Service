apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: cs-db-pv
  namespace: tds-simulation
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  hostPath:
    path: "/mnt/data/cs-db"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pctrbo-db-pv
  namespace: tds-simulation
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  hostPath:
    path: "/mnt/data/pctrbo-db"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pa-db-pv
  namespace: tds-simulation
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  hostPath:
    path: "/mnt/data/pa-db"
