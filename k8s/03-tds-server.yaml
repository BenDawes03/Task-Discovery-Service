apiVersion: apps/v1
kind: Deployment
metadata:
  name: tds-server
  namespace: tds-simulation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tds-server
  template:
    metadata:
      labels:
        app: tds-server
    spec:
      containers:
      - name: tds-server
        image: tds-server:latest
        imagePullPolicy: IfNotPresent
        args:
        - "--tls"
        - "--tls-cert"
        - "/run/tds-tls/server.crt"
        - "--tls-key"
        - "/run/tds-tls/server.key"
        - "--tls-client-ca"
        - "/run/tds-tls/ca.crt"
        - "--no-ui"
        - "--firewall-rules"
        - "/etc/tds/firewall/rules.txt"
        ports:
        - containerPort: 5000
          name: http
          protocol: TCP
        volumeMounts:
        - name: tds-tls
          mountPath: /run/tds-tls
          readOnly: true
        - name: firewall-rules
          mountPath: /etc/tds/firewall
          readOnly: true
      volumes:
      - name: tds-tls
        secret:
          secretName: tds-tls-certs
      - name: firewall-rules
        configMap:
          name: tds-firewall-rules
---
apiVersion: v1
kind: Service
metadata:
  name: tds-server
  namespace: tds-simulation
spec:
  selector:
    app: tds-server
  ports:
  - port: 5000
    targetPort: 5000
    name: http
    protocol: TCP
  type: ClusterIP
